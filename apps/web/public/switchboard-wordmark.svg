<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 110" fill="none" role="img" aria-label="Switchboard">
  <title>Switchboard</title>
  <!-- "Sw" -->
  <text
    x="4"
    y="84"
    fill="#0C1233"
    font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="82"
    font-weight="800"
    letter-spacing="-2.5"
  >Sw</text>

  <!-- Stemless "i" body -->
  <rect x="125" y="40" width="14.5" height="44" rx="2.5" fill="#0C1233" />
  <!-- Golden Amber "i" dot -->
  <circle cx="132.25" cy="24" r="9.5" fill="#F59E0B" />

  <!-- "tchboard" -->
  <text
    x="146"
    y="84"
    fill="#0C1233"
    font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="82"
    font-weight="800"
    letter-spacing="-2.5"
  >tchboard</text>
</svg>
