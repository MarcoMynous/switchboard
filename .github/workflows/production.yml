name: production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false # never cancel a migration halfway

env:
  NODE_VERSION: 22

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  migrate:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Migrate Neon main (unpooled)
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_PROD_UNPOOLED }}
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::warning::DATABASE_URL_PROD_UNPOOLED is not configured yet in Repository Secrets or the 'production' environment. Skipping DB migration."
          else
            pnpm db:migrate
          fi
