name: production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false # never cancel a migration halfway

env:
  NODE_VERSION: 22

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm test
      - run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "1"

  # Vercel Git auto-deploy is enabled in vercel.json, so every push to main deploys automatically.
  # This job keeps Neon main migrations in sync when DATABASE_URL_PROD_UNPOOLED is configured.
  migrate:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Migrate Neon main (unpooled)
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_PROD_UNPOOLED }}
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::notice::DATABASE_URL_PROD_UNPOOLED is not configured in Repository/Environment Secrets; skipping automated migration."
          else
            pnpm db:migrate
          fi
